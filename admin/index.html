<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Ernest's Journal</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#fbf7f0;
      --card:#ffffff;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --line:#eadfce;
      --accent:#7a4e2d;
      --soft:#f2e7d6;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    }

    .admin-shell{
      max-width:880px;
      margin:0 auto;
      padding:42px 18px 18px;
      text-align:center;
    }

    .admin-title{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:38px;
      font-weight:500;
    }

    .admin-note{
      margin:8px auto 18px;
      max-width:560px;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
    }

    .admin-card{
      display:inline-block;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.72);
      color:var(--accent);
      font-size:13px;
    }

    /* Decap injects the app below. These global touches keep the login screen warm. */
    [data-slate-editor],
    input,
    textarea,
    select,
    button{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif !important;
    }

    @media (max-width:640px){
      .admin-shell{ padding-top:30px; }
      .admin-title{ font-size:31px; }
    }
  </style>
</head>
<body>
  <header class="admin-shell">
    <h1 class="admin-title">Ernest's Journal Admin</h1>
    <p class="admin-note">
      A quiet writing desk for diary posts, stories, travel notes, and about-page content.
      Sign in with the GitHub account that owns this repository.
    </p>
    <div class="admin-card">Visitors can read the site. Only approved GitHub users can edit.</div>
  </header>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
