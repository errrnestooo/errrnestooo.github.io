<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | Ernest's Journal</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#fbf7f0;
      --card:#fffdf8;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --line:#eadfce;
      --accent:#7a4e2d;
      --soft:#f2e7d6;
      --shadow:0 18px 45px rgba(87,65,42,.08);
    }

    *{ box-sizing:border-box; }

    html,
    body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 20% 0%, rgba(242,231,214,.72), transparent 34%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:42px 16px 56px;
    }

    .admin-page{
      width:min(920px, 100%);
    }

    .language-toggle{
      display:flex;
      justify-content:flex-end;
      margin-bottom:14px;
    }

    .language-toggle-inner{
      display:inline-flex;
      gap:4px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.72);
    }

    .language-toggle button{
      border:0;
      border-radius:999px;
      background:transparent;
      color:var(--muted);
      padding:6px 10px;
      cursor:pointer;
      font-size:13px;
    }

    .language-toggle button.active{
      background:var(--soft);
      color:var(--accent);
    }

    .admin-card{
      display:grid;
      grid-template-columns:1fr minmax(320px, 420px);
      gap:28px;
      align-items:center;
      padding:34px;
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,253,248,.86);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }

    .intro{
      padding:8px 0;
    }

    .eyebrow{
      margin:0 0 10px;
      color:var(--accent);
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .admin-title{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:42px;
      line-height:1.1;
      font-weight:500;
    }

    .admin-note{
      margin:16px 0 0;
      max-width:520px;
      color:var(--muted);
      line-height:1.8;
      font-size:15px;
    }

    .permission-note{
      display:inline-block;
      margin-top:18px;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.72);
      color:var(--accent);
      font-size:13px;
    }

    .decap-panel{
      min-height:300px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:22px;
      background:#fff;
      box-shadow:0 10px 28px rgba(87,65,42,.06);
      overflow:hidden;
    }

    #nc-root{
      min-height:260px;
    }

    /* Decap renders its own login UI; these constraints keep it centered and prevent overlap. */
    #nc-root,
    #nc-root > div{
      min-height:260px !important;
      position:relative !important;
      z-index:1;
    }

    #nc-root section,
    #nc-root main{
      min-height:auto !important;
    }

    #nc-root button{
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      width:min(100%, 290px) !important;
      min-height:44px !important;
      margin:12px auto !important;
      border-radius:999px !important;
      box-shadow:none !important;
      line-height:1.2 !important;
      white-space:normal !important;
    }

    #nc-root input{
      max-width:100% !important;
    }

    [data-slate-editor],
    input,
    textarea,
    select,
    button{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif !important;
    }

    @media (max-width:760px){
      body{
        display:block;
        padding:24px 12px 40px;
      }

      .language-toggle{
        justify-content:center;
      }

      .admin-card{
        grid-template-columns:1fr;
        gap:20px;
        padding:22px;
        border-radius:22px;
      }

      .admin-title{
        font-size:34px;
        text-align:center;
      }

      .eyebrow,
      .admin-note,
      .intro{
        text-align:center;
      }

      .permission-note{
        border-radius:18px;
      }

      .decap-panel{
        padding:14px;
        min-height:280px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-page">
    <nav class="language-toggle" aria-label="Language">
      <div class="language-toggle-inner">
        <button type="button" class="active" data-lang="zh">CN</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>

    <main class="admin-card">
      <section class="intro">
        <p class="eyebrow" data-i18n="eyebrow">私人写作后台</p>
        <h1 class="admin-title" data-i18n="title">Ernest's Journal Admin</h1>
        <p class="admin-note" data-i18n="note">
          一个安静的写作入口，用来编辑日记、故事、旅行记录和关于页面。请使用拥有仓库权限的 GitHub 账号登录。
        </p>
        <div class="permission-note" data-i18n="permission">
          Visitors can read the site. Only approved GitHub users can edit.
        </div>
      </section>

      <section class="decap-panel" aria-label="CMS login area">
        <div id="nc-root"></div>
      </section>
    </main>
  </div>

  <script>
    (function(){
      const dictionary = {
        zh: {
          eyebrow: "私人写作后台",
          title: "Ernest's Journal Admin",
          note: "一个安静的写作入口，用来编辑日记、故事、旅行记录和关于页面。请使用拥有仓库权限的 GitHub 账号登录。",
          permission: "Visitors can read the site. Only approved GitHub users can edit."
        },
        en: {
          eyebrow: "Private writing desk",
          title: "Ernest's Journal Admin",
          note: "A quiet writing entrance for diary posts, stories, travel notes, and about-page content. Sign in with the GitHub account that has repository access.",
          permission: "Visitors can read the site. Only approved GitHub users can edit."
        }
      };

      function applyLanguage(lang){
        const safeLang = dictionary[lang] ? lang : "zh";
        localStorage.setItem("ernest_admin_lang", safeLang);
        document.documentElement.lang = safeLang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          node.textContent = dictionary[safeLang][node.dataset.i18n];
        });
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === safeLang);
        });
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => applyLanguage(button.dataset.lang));
      });

      applyLanguage(localStorage.getItem("ernest_admin_lang") || "zh");
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
