<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Plans | Ernest's Journal</title>

  <style>
    :root{
      --bg:#fbf7f0;
      --card:#ffffffcc;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --line:#eadfce;
      --link:#7a4e2d;
      --selected:#f2e7d6;
      --shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      max-width:980px; margin:0 auto; padding:44px 18px;
      background:var(--bg); color:var(--text); line-height:1.75;
    }
    header{ text-align:center; margin-bottom:18px; }
    h1{ margin:0 0 8px 0; font-size:36px; letter-spacing:.2px; }
    .nav{ text-align:center; margin:12px 0 24px; }
    .nav a{
      margin:0 10px; text-decoration:none; color:var(--muted);
      padding:6px 10px; border-radius:10px;
    }
    .nav a:hover{ background:var(--selected); color:var(--link); }
    .nav a.active{ background:var(--selected); color:var(--link); }

    .wrap{
      background:var(--card); border:1px solid var(--line);
      border-radius:18px; box-shadow:var(--shadow);
      padding:18px;
    }

    .controls{
      display:flex; flex-wrap:wrap; gap:10px;
      align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .controls .left, .controls .right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    select, button, input, textarea{
      border:1px solid var(--line);
      background:#fff; border-radius:12px;
      padding:8px 10px; font-size:14px;
    }
    textarea{ min-height:38px; resize:vertical; }

    button{ cursor:pointer; }
    button:hover{ background:var(--selected); }
    button.primary{
      background: #fff7ed;
      border-color:#d9c7ad;
      color:#4b3f35;
      font-weight:600;
    }
    button.danger{
      background:#fff;
      border-color:#e8c9a6;
      color:#7a4e2d;
    }

    .hint{ color:var(--muted); font-size:13px; margin-top:8px; }

    .calendar{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .dow{
      font-weight:600; color:var(--muted);
      text-align:center; padding:8px 0;
    }

    .cell{
      background:#fff; border:1px solid var(--line);
      border-radius:14px; padding:10px;
      min-height:68px;
      display:flex; flex-direction:column;
      gap:6px;
      cursor:pointer;
      transition: transform .05s ease, background .15s ease;
      position: relative;
      user-select:none;
    }
    .cell:hover{ background: #fff7ed; }
    .cell:active{ transform: scale(0.99); }
    .cell.muted{ opacity:.45; cursor:default; }
    .cell.muted:hover{ background:#fff; }

    .date{
      font-weight:700;
      display:flex; justify-content:space-between; align-items:center;
    }
    .tag{
      font-size:11px; color:var(--link);
      background:var(--selected);
      border:1px solid var(--line);
      padding:2px 8px; border-radius:999px;
    }

    /* Draft selection (current plan being selected) */
    .cell.selected{
      background: var(--selected);
      border-color:#d9c7ad;
    }

    /* Saved dates (belong to saved plans) */
    .cell.saved{
      outline: 2px solid rgba(215,178,138,0.35);
      outline-offset: 0px;
    }

    .section{
      margin-top:16px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
    }
    h2{ margin:0 0 10px 0; font-size:20px; }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
    }
    th, td{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      font-size:14px;
      vertical-align:top;
    }
    th{ background:#fff7ed; color:#4b3f35; }
    tr:last-child td{ border-bottom:none; }
    .small{ color:var(--muted); font-size:13px; }

    .pill{
      display:inline-block;
      padding:2px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--muted);
      font-size:12px;
      margin-right:6px;
      margin-top:6px;
      white-space:nowrap;
    }

    .pill.strong{
      border-color:#d9c7ad;
      background:#fff7ed;
      color:#4b3f35;
      font-weight:600;
    }

    .stack{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .wide{
      width: min(520px, 92vw);
    }

    /* ===== Singapore Public Holiday styles ===== */
    .cell.is-ph{
      border-color:#d7b28a !important;
      background:#fff6e8 !important;
    }
    .ph-tag{
      position:absolute;
      top:10px;
      right:10px;
      font-size:11px;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid #e8c9a6;
      background:#fff;
      color:#7a4e2d;
    }
    .ph-name{
      margin-top: 2px;
      font-size:12px;
      color:#7a4e2d;
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-right:8px;
    }

    .muted-box{
      border:1px dashed var(--line);
      border-radius:14px;
      padding:12px;
      background: rgba(255,255,255,0.6);
    }
  </style>
</head>

<body>
  <header>
    <h1>Plans</h1>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="diary.html">Diary</a>
      <a href="travel.html">Travel</a>
      <a href="plans.html" class="active">Plans</a>
      <a href="about.html">About</a>
    </div>
  </header>

  <div class="wrap">
    <div class="controls">
      <div class="left">
        <label class="small">Year</label>
        <select id="yearSelect"></select>

        <label class="small">Month</label>
        <select id="monthSelect"></select>

        <button id="todayBtn">Today</button>
      </div>

      <div class="right">
        <button id="clearMonthBtn">Clear This Month (Draft)</button>
        <button id="clearDraftBtn">Clear Draft</button>
        <button id="clearAllBtn" class="danger">Clear All Saved</button>
      </div>
    </div>

    <div class="muted-box" style="margin-bottom:10px;">
      <div class="stack">
        <input id="planNameInput" class="wide" placeholder="Plan Name（必填）例如：Jordan Trip" />
        <button id="savePlanBtn" class="primary">Save Plan</button>
      </div>
      <div style="margin-top:10px;">
        <textarea id="planNoteInput" class="wide" placeholder="Note（去哪里/做什么，可选）例如：Amman → Petra → Wadi Rum"></textarea>
      </div>
      <div class="hint" id="draftHint" style="margin-top:8px;"></div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="hint">
      ✅ 点击日期：加入/取消当前“Draft Plan”。<br/>
      ✅ <b>按住 Shift</b> 再点一个日期：会自动选中两者之间的连续区间（适合 12/22–12/26）。<br/>
      🟨 标注 <b>PH</b> 的为新加坡公共假期（Public Holiday）。
    </div>
  </div>

  <div class="section">
    <h2>Yearly Summary (Saved Plans)</h2>
    <div class="small">每保存一次 Plan，就会在这里新增一行。你可以先保存 4 月的，再保存 8 月的。</div>

    <div style="margin-top:12px; overflow:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:90px;">Year</th>
            <th style="width:170px;">Plan</th>
            <th style="width:90px;">Days</th>
            <th>Details (Ranges)</th>
            <th style="width:260px;">Note</th>
            <th style="width:110px;">Action</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

<script>
  // ==========================
  // 1) Singapore Public Holidays (manual list)
  // ==========================
  // Key format: "YYYY-MM-DD"
  const SG_PUBLIC_HOLIDAYS = {
    2026: {
      "2026-01-01": "New Year’s Day",
      "2026-02-17": "Chinese New Year (Day 1)",
      "2026-02-18": "Chinese New Year (Day 2)",
      "2026-03-20": "Good Friday",
      "2026-05-01": "Labour Day",
      "2026-05-03": "Hari Raya Puasa",
      "2026-05-24": "Vesak Day",
      "2026-06-27": "Hari Raya Haji",
      "2026-08-09": "National Day",
      "2026-11-08": "Deepavali",
      "2026-12-25": "Christmas Day"
    },
    2025: {
      "2025-01-01": "New Year’s Day",
      "2025-01-29": "Chinese New Year (Day 1)",
      "2025-01-30": "Chinese New Year (Day 2)",
      "2025-03-31": "Hari Raya Puasa",
      "2025-04-18": "Good Friday",
      "2025-05-01": "Labour Day",
      "2025-05-12": "Vesak Day",
      "2025-06-07": "Hari Raya Haji",
      "2025-08-09": "National Day",
      "2025-10-20": "Deepavali",
      "2025-12-25": "Christmas Day"
    }
  };

  function getPublicHolidayLabelByKey(key){
    const y = Number(key.slice(0,4));
    const map = SG_PUBLIC_HOLIDAYS[y] || {};
    return map[key] || "";
  }

  // ==========================
  // 2) Storage model
  // ==========================
  // savedPlans: [{ id, name, note, dates:[YYYY-MM-DD...] }]
  // draftDates: { "YYYY-MM-DD": true }
  const STORAGE_SAVED = "ernest_journal_saved_plans_v2";
  const STORAGE_DRAFT = "ernest_journal_draft_plan_v2";

  function loadJson(key, fallback){
    try { return JSON.parse(localStorage.getItem(key) || ""); } catch(e) { return fallback; }
  }
  function saveJson(key, data){
    localStorage.setItem(key, JSON.stringify(data));
  }

  let savedPlans = loadJson(STORAGE_SAVED, []);
  let draftDates = loadJson(STORAGE_DRAFT, {}); // object map for quick toggle

  // ==========================
  // 3) Helpers
  // ==========================
  const pad2 = (n) => String(n).padStart(2, "0");
  function ymd(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

  function parseYmd(s){
    const [y,m,d] = s.split("-").map(Number);
    return {y,m,d};
  }
  function toDateObj(key){
    const {y,m,d} = parseYmd(key);
    return new Date(y, m-1, d);
  }
  function diffDays(aKey, bKey){
    const ms = 24*60*60*1000;
    return Math.round((toDateObj(bKey) - toDateObj(aKey)) / ms);
  }

  function daysInMonth(year, month){ // month: 1-12
    return new Date(year, month, 0).getDate();
  }
  function firstDow(year, month){ // 0=Sun..6=Sat
    return new Date(year, month-1, 1).getDay();
  }

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[m]);
  }

  function formatDateYMDChinese(key){
    const {y,m,d} = parseYmd(key);
    return `${y}/${pad2(m)}/${pad2(d)}`;
  }

  // Convert sorted dates into ranges: [ {start, end, days}, ... ]
  function makeRanges(sortedKeys){
    const ranges = [];
    let start = null;
    let prev = null;

    for(const k of sortedKeys){
      if(!start){
        start = k; prev = k;
        continue;
      }
      if(diffDays(prev, k) === 1){
        prev = k;
      }else{
        ranges.push({ start, end: prev, days: diffDays(start, prev) + 1 });
        start = k; prev = k;
      }
    }
    if(start) ranges.push({ start, end: prev, days: diffDays(start, prev) + 1 });
    return ranges;
  }

  function rangesToHtmlPills(ranges){
    return ranges.map(r => {
      const start = formatDateYMDChinese(r.start);
      const end = formatDateYMDChinese(r.end);
      const text = (r.start === r.end) ? `${start}` : `${start}–${end}`;
      return `<span class="pill strong">${text}</span>`;
    }).join("");
  }

  function allSavedDatesSet(){
    const set = new Set();
    savedPlans.forEach(p => (p.dates || []).forEach(d => set.add(d)));
    return set;
  }

  // ==========================
  // 4) UI refs
  // ==========================
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const calendarEl = document.getElementById("calendar");
  const summaryBody = document.getElementById("summaryBody");

  const planNameInput = document.getElementById("planNameInput");
  const planNoteInput = document.getElementById("planNoteInput");
  const savePlanBtn = document.getElementById("savePlanBtn");
  const draftHint = document.getElementById("draftHint");

  const todayBtn = document.getElementById("todayBtn");
  const clearMonthBtn = document.getElementById("clearMonthBtn");
  const clearDraftBtn = document.getElementById("clearDraftBtn");
  const clearAllBtn = document.getElementById("clearAllBtn");

  // ==========================
  // 5) Init selects (years)
  // ==========================
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth()+1;

  const startYear = currentYear - 3;
  const endYear   = currentYear + 15;

  for(let y=startYear; y<=endYear; y++){
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    yearSelect.appendChild(opt);
  }
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for(let m=1; m<=12; m++){
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = `${m} (${monthNames[m-1]})`;
    monthSelect.appendChild(opt);
  }

  yearSelect.value = currentYear;
  monthSelect.value = currentMonth;

  const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // ==========================
  // 6) Calendar with Shift-range selection
  // ==========================
  let lastClickedKey = null;

  function setDraftDate(key, val){
    if(val) draftDates[key] = true;
    else delete draftDates[key];
    saveJson(STORAGE_DRAFT, draftDates);
  }

  function toggleDraftDate(key){
    const exists = !!draftDates[key];
    setDraftDate(key, !exists);
  }

  function addRangeToDraft(aKey, bKey){
    // assume aKey and bKey in same timeline; we just walk day by day
    const a = toDateObj(aKey);
    const b = toDateObj(bKey);
    const step = a <= b ? 1 : -1;

    let cur = new Date(a);
    while(true){
      const k = ymd(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
      setDraftDate(k, true);
      if(cur.getFullYear() === b.getFullYear() && cur.getMonth() === b.getMonth() && cur.getDate() === b.getDate()){
        break;
      }
      cur.setDate(cur.getDate() + step);
    }
  }

  function updateDraftHint(){
    const keys = Object.keys(draftDates).sort();
    if(keys.length === 0){
      draftHint.innerHTML = `Draft：<b>0</b> day selected.（先点日期或 Shift 连选）`;
      return;
    }
    const ranges = makeRanges(keys);
    const totalDays = keys.length;
    draftHint.innerHTML = `Draft：<b>${totalDays}</b> day(s) selected. Ranges：${rangesToHtmlPills(ranges)}`;
  }

  function renderCalendar(){
    calendarEl.innerHTML = "";

    // day-of-week header
    for(const d of dows){
      const div = document.createElement("div");
      div.className = "dow";
      div.textContent = d;
      calendarEl.appendChild(div);
    }

    const y = Number(yearSelect.value);
    const m = Number(monthSelect.value);

    const total = daysInMonth(y,m);
    const first = firstDow(y,m);

    const savedSet = allSavedDatesSet();

    // leading blanks
    for(let i=0;i<first;i++){
      const blank = document.createElement("div");
      blank.className = "cell muted";
      blank.innerHTML = `<div class="date"><span></span><span></span></div>`;
      calendarEl.appendChild(blank);
    }

    for(let d=1; d<=total; d++){
      const key = ymd(y,m,d);

      const inDraft = !!draftDates[key];
      const phLabel = getPublicHolidayLabelByKey(key);
      const isSaved = savedSet.has(key);

      const cell = document.createElement("div");
      cell.className =
        "cell" +
        (inDraft ? " selected" : "") +
        (isSaved ? " saved" : "") +
        (phLabel ? " is-ph" : "");

      cell.innerHTML = `
        <div class="date">
          <span>${d}</span>
          ${inDraft ? `<span class="tag">Draft</span>` : `<span></span>`}
        </div>
        ${phLabel ? `<div class="ph-name">${escapeHtml(phLabel)}</div>` : ``}
        ${phLabel ? `<div class="ph-tag">PH</div>` : ``}
      `;

      cell.addEventListener("click", (ev) => {
        // Shift 连选：从 lastClickedKey 到当前 key 全部选中
        if(ev.shiftKey && lastClickedKey){
          addRangeToDraft(lastClickedKey, key);
        }else{
          toggleDraftDate(key);
        }
        lastClickedKey = key;
        updateDraftHint();
        renderCalendar();
      });

      calendarEl.appendChild(cell);
    }
  }

  // ==========================
  // 7) Save plan / Summary
  // ==========================
  function renderSummary(){
    summaryBody.innerHTML = "";

    if(!savedPlans.length){
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="6" class="small">还没有保存任何 Plan。先选日期（可 Shift 连选）→ 填 Plan Name → Save Plan。</td>`;
      summaryBody.appendChild(tr);
      return;
    }

    // Sort by start date
    const plansSorted = [...savedPlans].sort((a,b) => {
      const aStart = (a.dates || []).slice().sort()[0] || "9999-12-31";
      const bStart = (b.dates || []).slice().sort()[0] || "9999-12-31";
      return aStart.localeCompare(bStart);
    });

    // render each plan as its own row; Year from plan start date
    for(const p of plansSorted){
      const dates = (p.dates || []).slice().sort();
      const year = dates[0] ? dates[0].slice(0,4) : "";
      const ranges = makeRanges(dates);
      const days = dates.length;

      const detailsHtml = rangesToHtmlPills(ranges);
      const noteHtml = p.note ? escapeHtml(p.note) : `<span class="small">—</span>`;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${escapeHtml(year)}</b></td>
        <td>${escapeHtml(p.name || "Untitled")}</td>
        <td>${days}</td>
        <td>${detailsHtml}</td>
        <td>${noteHtml}</td>
        <td>
          <button class="danger" data-del="${escapeHtml(p.id)}">Delete</button>
        </td>
      `;
      summaryBody.appendChild(tr);
    }

    // bind delete buttons
    summaryBody.querySelectorAll("button[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-del");
        if(!confirm("确定删除这个 Plan 吗？")) return;
        savedPlans = savedPlans.filter(p => p.id !== id);
        saveJson(STORAGE_SAVED, savedPlans);
        renderSummary();
        renderCalendar();
      });
    });
  }

  function newId(){
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  savePlanBtn.addEventListener("click", () => {
    const name = planNameInput.value.trim();
    if(!name){
      alert("请先填写 Plan Name（例如：Jordan Trip）");
      planNameInput.focus();
      return;
    }
    const dates = Object.keys(draftDates).sort();
    if(!dates.length){
      alert("你还没选任何日期。先在日历里点选（可 Shift 连选）。");
      return;
    }

    const note = planNoteInput.value.trim();
    const plan = { id: newId(), name, note, dates };

    savedPlans.push(plan);
    saveJson(STORAGE_SAVED, savedPlans);

    // clear draft for next plan
    draftDates = {};
    saveJson(STORAGE_DRAFT, draftDates);
    lastClickedKey = null;

    // reset inputs (optional: keep note)
    planNameInput.value = "";
    planNoteInput.value = "";

    updateDraftHint();
    renderSummary();
    renderCalendar();
    alert("已保存 ✅ 现在可以开始选下一个计划了。");
  });

  // ==========================
  // 8) Buttons
  // ==========================
  todayBtn.addEventListener("click", () => {
    yearSelect.value = currentYear;
    monthSelect.value = currentMonth;
    renderCalendar();
  });

  clearMonthBtn.addEventListener("click", () => {
    const y = Number(yearSelect.value);
    const m = Number(monthSelect.value);
    const prefix = `${y}-${pad2(m)}-`;
    Object.keys(draftDates).forEach(k => {
      if(k.startsWith(prefix)) delete draftDates[k];
    });
    saveJson(STORAGE_DRAFT, draftDates);
    updateDraftHint();
    renderCalendar();
  });

  clearDraftBtn.addEventListener("click", () => {
    if(!confirm("确定清空 Draft（未保存的选择）吗？")) return;
    draftDates = {};
    saveJson(STORAGE_DRAFT, draftDates);
    lastClickedKey = null;
    updateDraftHint();
    renderCalendar();
  });

  clearAllBtn.addEventListener("click", () => {
    if(!confirm("确定清空全部 Saved Plans 吗？（不可恢复）")) return;
    savedPlans = [];
    saveJson(STORAGE_SAVED, savedPlans);
    renderSummary();
    renderCalendar();
  });

  yearSelect.addEventListener("change", renderCalendar);
  monthSelect.addEventListener("change", renderCalendar);

  // ==========================
  // 9) First render
  // ==========================
  updateDraftHint();
  renderCalendar();
  renderSummary();
</script>
</body>
</html>
