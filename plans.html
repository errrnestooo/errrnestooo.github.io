<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Plans | Ernest's Journal</title>

  <style>
    :root{
      --bg:#fbf7f0;
      --card:#ffffffcc;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --line:#eadfce;
      --link:#7a4e2d;
      --selected:#f2e7d6;
      --shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      max-width:980px; margin:0 auto; padding:44px 18px;
      background:var(--bg); color:var(--text); line-height:1.75;
    }
    header{ text-align:center; margin-bottom:18px; }
    h1{ margin:0 0 8px 0; font-size:36px; letter-spacing:.2px; }
    .nav{ text-align:center; margin:12px 0 24px; }
    .nav a{
      margin:0 10px; text-decoration:none; color:var(--muted);
      padding:6px 10px; border-radius:10px;
    }
    .nav a:hover{ background:var(--selected); color:var(--link); }
    .nav a.active{ background:var(--selected); color:var(--link); }

    .wrap{
      background:var(--card); border:1px solid var(--line);
      border-radius:18px; box-shadow:var(--shadow);
      padding:18px;
    }

    .controls{
      display:flex; flex-wrap:wrap; gap:10px;
      align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .controls .left, .controls .right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    select, button, input{
      border:1px solid var(--line);
      background:#fff; border-radius:12px;
      padding:8px 10px; font-size:14px;
    }
    button{ cursor:pointer; }
    button:hover{ background:var(--selected); }
    .hint{ color:var(--muted); font-size:13px; margin-top:8px; }

    .calendar{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .dow{
      font-weight:600; color:var(--muted);
      text-align:center; padding:8px 0;
    }
    .cell{
      background:#fff; border:1px solid var(--line);
      border-radius:14px; padding:10px;
      min-height:62px;
      display:flex; flex-direction:column;
      gap:6px;
      cursor:pointer;
      transition: transform .05s ease, background .15s ease;
      position: relative;
    }
    .cell:hover{ background: #fff7ed; }
    .cell:active{ transform: scale(0.99); }
    .cell.muted{ opacity:.45; cursor:default; }
    .cell.muted:hover{ background:#fff; }
    .date{
      font-weight:700;
      display:flex; justify-content:space-between; align-items:center;
    }
    .tag{
      font-size:11px; color:var(--link);
      background:var(--selected);
      border:1px solid var(--line);
      padding:2px 8px; border-radius:999px;
    }
    .cell.selected{
      background: var(--selected);
      border-color:#d9c7ad;
    }

    .section{
      margin-top:16px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
    }
    h2{ margin:0 0 10px 0; font-size:20px; }

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
    }
    th, td{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      font-size:14px;
    }
    th{ background:#fff7ed; color:#4b3f35; }
    tr:last-child td{ border-bottom:none; }
    .small{ color:var(--muted); font-size:13px; }

    .pill{
      display:inline-block;
      padding:2px 8px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--muted);
      font-size:12px;
      margin-right:6px;
      margin-top:6px;
    }

    /* ===== Singapore Public Holiday styles ===== */
    .cell.is-ph{
      border-color:#d7b28a !important;
      background:#fff6e8 !important;
    }
    .ph-tag{
      position:absolute;
      top:10px;
      right:10px;
      font-size:11px;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid #e8c9a6;
      background:#fff;
      color:#7a4e2d;
    }
    .ph-name{
      margin-top: 4px;
      font-size:12px;
      color:#7a4e2d;
      line-height:1.3;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-right:8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Plans</h1>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="diary.html">Diary</a>
      <a href="travel.html">Travel</a>
      <a href="plans.html" class="active">Plans</a>
      <a href="about.html">About</a>
    </div>
  </header>

  <div class="wrap">
    <div class="controls">
      <div class="left">
        <label class="small">Year</label>
        <select id="yearSelect"></select>

        <label class="small">Month</label>
        <select id="monthSelect"></select>

        <button id="todayBtn">Today</button>
      </div>

      <div class="right">
        <input id="labelInput" placeholder="假期名称（可选）例如：Jordan Trip" />
        <button id="clearMonthBtn">Clear This Month</button>
        <button id="clearAllBtn">Clear All</button>
      </div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="hint">
      ✅ 点击日期：加入/取消“计划假期”。右上角可填一个“假期名称”（可选），会记录到该日期。<br/>
      🟨 标注 <b>PH</b> 的为新加坡公共假期（Public Holiday）。
    </div>
  </div>

  <div class="section">
    <h2>Yearly Summary</h2>
    <div class="small">按年份汇总你选中的假期日期：天数 + 日期清单（可带名称）。</div>
    <div style="margin-top:12px; overflow:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:120px;">Year</th>
            <th style="width:120px;">Days</th>
            <th>Details</th>
<th style="width:260px;">Note</th>

          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

<script>
  // ===== Singapore Public Holidays (manual list) =====
  // Key format: "YYYY-MM-DD"
  const SG_PUBLIC_HOLIDAYS = {
    2026: {
      "2026-01-01": "New Year’s Day",
      "2026-02-17": "Chinese New Year (Day 1)",
      "2026-02-18": "Chinese New Year (Day 2)",
      "2026-03-20": "Good Friday",
      "2026-05-01": "Labour Day",
      "2026-05-03": "Hari Raya Puasa",
      "2026-05-24": "Vesak Day",
      "2026-06-27": "Hari Raya Haji",
      "2026-08-09": "National Day",
      "2026-11-08": "Deepavali",
      "2026-12-25": "Christmas Day"
    },
    2025: {
      "2025-01-01": "New Year’s Day",
      "2025-01-29": "Chinese New Year (Day 1)",
      "2025-01-30": "Chinese New Year (Day 2)",
      "2025-03-31": "Hari Raya Puasa",
      "2025-04-18": "Good Friday",
      "2025-05-01": "Labour Day",
      "2025-05-12": "Vesak Day",
      "2025-06-07": "Hari Raya Haji",
      "2025-08-09": "National Day",
      "2025-10-20": "Deepavali",
      "2025-12-25": "Christmas Day"
    }
  };

  function getPublicHolidayLabelByKey(key){
    const y = Number(key.slice(0,4));
    const map = SG_PUBLIC_HOLIDAYS[y] || {};
    return map[key] || "";
  }

  // --- Storage ---
  const STORAGE_KEY = "ernest_journal_plans_v1";
  function loadPlans(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    }catch(e){
      return {};
    }
  }
  function savePlans(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // data shape:
  // plans["YYYY-MM-DD"] = { label: "Jordan Trip" }
  let plans = loadPlans();

  // --- Helpers ---
  const pad2 = (n) => String(n).padStart(2, "0");
  function ymd(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
  function parseYmd(s){
    const [y,m,d] = s.split("-").map(Number);
    return {y,m,d};
  }

  function daysInMonth(year, month){ // month: 1-12
    return new Date(year, month, 0).getDate();
  }

  function firstDow(year, month){ // 0=Sun..6=Sat
    return new Date(year, month-1, 1).getDay();
  }

  function formatDateChinese(key){
    const {y,m,d} = parseYmd(key);
    return `${y}/${pad2(m)}/${pad2(d)}`;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[m]);
  }

  // --- UI refs ---
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const calendarEl = document.getElementById("calendar");
  const summaryBody = document.getElementById("summaryBody");
  const labelInput = document.getElementById("labelInput");
  const todayBtn = document.getElementById("todayBtn");
  const clearMonthBtn = document.getElementById("clearMonthBtn");
  const clearAllBtn = document.getElementById("clearAllBtn");

  // --- Init selects ---
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth()+1;

  const startYear = currentYear - 3;
  const endYear   = currentYear + 15;

  for(let y=startYear; y<=endYear; y++){
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    yearSelect.appendChild(opt);
  }

  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for(let m=1; m<=12; m++){
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = `${m} (${monthNames[m-1]})`;
    monthSelect.appendChild(opt);
  }

  yearSelect.value = currentYear;
  monthSelect.value = currentMonth;

  const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // --- Render calendar ---
  function renderCalendar(){
    calendarEl.innerHTML = "";

    // header row
    for(const d of dows){
      const div = document.createElement("div");
      div.className = "dow";
      div.textContent = d;
      calendarEl.appendChild(div);
    }

    const y = Number(yearSelect.value);
    const m = Number(monthSelect.value);

    const total = daysInMonth(y,m);
    const first = firstDow(y,m);

    // leading blanks
    for(let i=0;i<first;i++){
      const blank = document.createElement("div");
      blank.className = "cell muted";
      blank.innerHTML = `<div class="date"><span></span><span></span></div>`;
      calendarEl.appendChild(blank);
    }

    for(let d=1; d<=total; d++){
      const key = ymd(y,m,d);

      const isSelected = !!plans[key];
      const label = plans[key]?.label?.trim() || "";

      // PH check
      const phLabel = getPublicHolidayLabelByKey(key);

      const cell = document.createElement("div");
      cell.className = "cell" + (isSelected ? " selected" : "") + (phLabel ? " is-ph" : "");

      cell.innerHTML = `
        <div class="date">
          <span>${d}</span>
          ${isSelected ? `<span class="tag">Planned</span>` : `<span></span>`}
        </div>

        ${phLabel ? `<div class="ph-name">${escapeHtml(phLabel)}</div>` : ``}
        ${label ? `<div class="small">${escapeHtml(label)}</div>` : `<div class="small">&nbsp;</div>`}
        ${phLabel ? `<div class="ph-tag">PH</div>` : ``}
      `;

     cell.addEventListener("click", () => {
  if(plans[key]){
    // 已选：再点一次就取消
    delete plans[key];
  }else{
    const labelVal = labelInput.value.trim();

    // 新增：note（去哪里）
    const noteVal = prompt("Note（去哪里/做什么，可留空）:", "") || "";

    plans[key] = { label: labelVal, note: noteVal.trim() };
  }

  savePlans(plans);
  renderCalendar();
  renderSummary();
});


      calendarEl.appendChild(cell);
    }
  }

  // --- Summary table ---
  function renderSummary(){
  // group by year
  const byYear = {};
  Object.keys(plans).forEach(key => {
    const y = key.slice(0,4);
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(key);
  });

  const years = Object.keys(byYear).sort((a,b)=>Number(a)-Number(b));
  summaryBody.innerHTML = "";

  if(years.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="4" class="small">还没有选择任何假期日期。</td>`;
    summaryBody.appendChild(tr);
    return;
  }

  // helper: split into consecutive groups
  function splitConsecutive(sortedKeys){
    const groups = [];
    let current = [];

    function toDate(k){
      const {y,m,d} = parseYmd(k);
      return new Date(y, m-1, d);
    }
    function diffDays(a,b){
      const ms = 24*60*60*1000;
      return Math.round((toDate(b) - toDate(a)) / ms);
    }

    for(let i=0;i<sortedKeys.length;i++){
      const k = sortedKeys[i];
      if(current.length === 0){
        current.push(k);
        continue;
      }
      const prev = current[current.length-1];
      if(diffDays(prev, k) === 1){
        current.push(k);
      }else{
        groups.push(current);
        current = [k];
      }
    }
    if(current.length) groups.push(current);
    return groups;
  }

  for(const y of years){
    const keys = byYear[y].sort(); // YYYY-MM-DD string sort works
    const groups = splitConsecutive(keys);

    // 同一年可能多行：第 1 行显示 Year，后面行 Year 为空（更清爽）
    groups.forEach((grp, idx) => {
      const days = grp.length;

      const details = grp.map(k => {
        const label = plans[k]?.label?.trim();
        if(label){
          return `<span class="pill">${formatDateChinese(k)} · ${escapeHtml(label)}</span>`;
        }
        return `<span class="pill">${formatDateChinese(k)}</span>`;
      }).join("");

      // Note：把该段假期里所有 note 收集（去重）合并展示
      const notesSet = new Set();
      grp.forEach(k => {
        const n = plans[k]?.note?.trim();
        if(n) notesSet.add(n);
      });
      const noteText = Array.from(notesSet).join(" / ");
      const noteHtml = noteText ? escapeHtml(noteText) : `<span class="small">—</span>`;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${idx === 0 ? y : ""}</b></td>
        <td>${days}</td>
        <td>${details}</td>
        <td>${noteHtml}</td>
      `;
      summaryBody.appendChild(tr);
    });
  }
}


    const years = Object.keys(byYear).sort((a,b)=>Number(a)-Number(b));
    summaryBody.innerHTML = "";

    if(years.length === 0){
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="3" class="small">还没有选择任何假期日期。</td>`;
      summaryBody.appendChild(tr);
      return;
    }

    for(const y of years){
      const keys = byYear[y].sort();
      const days = keys.length;

      const details = keys.map(k => {
        const label = plans[k]?.label?.trim();
        if(label){
          return `<span class="pill">${formatDateChinese(k)} · ${escapeHtml(label)}</span>`;
        }
        return `<span class="pill">${formatDateChinese(k)}</span>`;
      }).join("");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${y}</b></td>
        <td>${days}</td>
        <td>${details}</td>
      `;
      summaryBody.appendChild(tr);
    }
  }

  // --- Buttons ---
  todayBtn.addEventListener("click", () => {
    yearSelect.value = currentYear;
    monthSelect.value = currentMonth;
    renderCalendar();
  });

  clearMonthBtn.addEventListener("click", () => {
    const y = Number(yearSelect.value);
    const m = Number(monthSelect.value);
    const prefix = `${y}-${pad2(m)}-`;
    Object.keys(plans).forEach(k => {
      if(k.startsWith(prefix)) delete plans[k];
    });
    savePlans(plans);
    renderCalendar();
    renderSummary();
  });

  clearAllBtn.addEventListener("click", () => {
    if(!confirm("确定要清空全部计划假吗？")) return;
    plans = {};
    savePlans(plans);
    renderCalendar();
    renderSummary();
  });

  // --- Select change ---
  yearSelect.addEventListener("change", () => {
    renderCalendar();
  });
  monthSelect.addEventListener("change", () => {
    renderCalendar();
  });

  // --- First render ---
  renderCalendar();
  renderSummary();
</script>
</body>
</html>
