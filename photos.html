      <div class="journal-kicker">Photo archive</div>
      <h1 data-i18n="photos.title">&#x7167;&#x7247;</h1>
      <p data-i18n="photos.subtitle">&#x4E00;&#x4E9B;&#x8DEF;&#x8FC7;&#x7684;&#x5149;&#x3001;&#x7A97;&#x53E3;&#x3001;&#x673A;&#x573A;&#x548C;&#x591C;&#x665A;&#x3002;</p>
    </header>

    <section class="photo-grid">
      <figure class="photo-tile fade-in"><div class="photo-art" style="--photo-color:#d8c2a5"></div><figcaption data-i18n="photos.streets">&#x8857;&#x9053;</figcaption></figure>
      <figure class="photo-tile fade-in"><div class="photo-art" style="--photo-color:#b9b7aa"></div><figcaption data-i18n="photos.airports">&#x673A;&#x573A;</figcaption></figure>

      <figure class="photo-tile fade-in"><div class="photo-art" style="--photo-color:#b7c0b2"></div><figcaption data-i18n="photos.singapore">&#x65B0;&#x52A0;&#x5761;</figcaption></figure>
      <figure class="photo-tile fade-in"><div class="photo-art" style="--photo-color:#6f665e"></div><figcaption data-i18n="photos.night">&#x591C;&#x665A;</figcaption></figure>

    </section>

    <div class="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <div class="photo-art" style="--photo-color:#d8c2a5"></div>
      </div>
    </div>

    <footer class="archive-footer" data-i18n="footer">Ernest's Journal - &#x5728;&#x65B0;&#x52A0;&#x5761;&#x7F13;&#x6162;&#x5EFA;&#x9020;&#x7684;&#x4E2A;&#x4EBA;&#x6863;&#x6848;</footer>

  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const lightbox = document.querySelector(".lightbox");
      document.querySelectorAll(".photo-tile").forEach(function(tile){
        tile.addEventListener("click", function(){
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
        });
      });
      lightbox.addEventListener("click", function(){
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
      });
    });
  </script>
  <script src="assets/js/i18n.js"></script>
