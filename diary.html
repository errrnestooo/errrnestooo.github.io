<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ernest's Journal 的日记档案，包含标签、心情、阅读时间和可展开文章卡片。">
  <meta property="og:title" content="日记 | Ernest's Journal">
  <meta property="og:description" content="一个安静的日记档案，记录日子、心情和小小的转折。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://songyangao.com/diary.html">
  <title>日记 | Ernest's Journal</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    :root{
      --bg:#fbf7f0;
      --card:#ffffff;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --border:#eadfce;
      --accent:#7a4e2d;
      --selected:#f2e7d6;
      --shadow:0 10px 25px rgba(0,0,0,.06);
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      max-width:900px;
      margin:0 auto;
      padding:40px 20px 80px;
      background:var(--bg);
      color:var(--text);
      line-height:1.8;
    }

    h1{ text-align:center; margin:0 0 10px; }

    .subtitle{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      margin-bottom:24px;
    }

    .nav{
      text-align:center;
      margin-bottom:30px;
    }

    .nav a{
      margin:0 12px;
      text-decoration:none;
      color:var(--muted);
      padding:6px 10px;
      border-radius:10px;
    }

    .nav a:hover,
    .nav a.active{
      background:var(--selected);
      color:var(--accent);
    }

    .diary-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      margin-bottom:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .diary-toggle{
      width:100%;
      border:0;
      background:transparent;
      padding:20px;
      text-align:left;
      cursor:pointer;
      color:var(--text);
    }

    .diary-toggle:hover{ background:#fff7eb; }

    .diary-head{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:flex-start;
    }

    .diary-title{
      margin:0 0 8px;
      font-size:23px;
    }

    .diary-meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color:var(--muted);
      font-size:13px;
    }

    .tag,
    .mood{
      border:1px solid var(--border);
      background:#fffaf3;
      color:var(--accent);
      border-radius:999px;
      padding:2px 8px;
      font-size:12px;
    }

    .chev{
      width:9px;
      height:9px;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform:rotate(45deg);
      transition:transform .18s ease;
      margin-top:10px;
      flex:none;
    }

    .diary-card.is-open .chev{ transform:rotate(-135deg); }

    .diary-body{
      display:grid;
      grid-template-rows:0fr;
      opacity:0;
      transition:grid-template-rows .3s ease, opacity .24s ease;
    }

    .diary-card.is-open .diary-body{
      grid-template-rows:1fr;
      opacity:1;
    }

    .diary-body-inner{
      overflow:hidden;
      padding:0 20px;
    }

    .diary-card.is-open .diary-body-inner{
      padding-bottom:20px;
    }

    .entry-text{
      border-top:1px dashed #efe5d7;
      padding-top:14px;
      color:#3a342f;
    }

    .entry-text p{ margin:0 0 12px; }

    .entry-actions{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .entry-actions a{
      color:var(--accent);
      text-decoration:none;
      font-size:14px;
    }

    .entry-actions a:hover{ text-decoration:underline; }

    @media (max-width:640px){
      body{ padding:34px 16px 70px; }
      .nav{
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:8px;
      }
      .nav a{ margin:0; background:rgba(255,255,255,.45); }
      .diary-toggle{ padding:17px; }
      .diary-title{ font-size:21px; }
      .diary-head{ gap:12px; }
    }
  </style>
</head>
<body>
  <h1 data-i18n="diary.title">日记</h1>
  <div class="subtitle" data-i18n="diary.subtitle">小小的记录、心情，和以后还想回来看的片刻。</div>

  <div class="nav">
    <a href="index.html">首页</a>
    <a href="diary.html" class="active">日记</a>
    <a href="stories.html">小说</a>
    <a href="travel.html">旅行</a>
    <a href="plans.html">计划</a>
    <a href="about.html">关于</a>
  </div>

  <main id="diaryList"></main>

  <script>
    // Future markdown-style entries can keep plain text here and be rendered into cards.
    const diaryEntries = [
      {
        date:"2026-03-29",
        title:{ zh:"搭建我的网站", en:"Building My Website" },
        location:{ zh:"新加坡", en:"Singapore" },
        mood:{ zh:"专注", en:"Focused" },
        tags:{ zh:["网站","计划","学习"], en:["website","plans","learning"] },
        minutes:2,
        url:"posts/2026-03-29.html",
        body:{
          zh:["今天我继续把 Plans 页面打磨成一个可以同步、也可以慢慢生长的小系统。","从 GitHub Pages 到 Cloudflare Worker 和 KV，这是我第一次完整搭建前后端分离的网站。"],
          en:["Today I kept shaping the Plans page into something that can sync and grow.","From GitHub Pages to Cloudflare Worker and KV, this is my first complete front-end and back-end split for the site."]
        }
      },
      {
        date:"2026-01-30",
        title:{ zh:"Hello World", en:"Hello World" },
        location:{ zh:"新加坡", en:"Singapore" },
        mood:{ zh:"期待", en:"Hopeful" },
        tags:{ zh:["开始","日记","档案"], en:["beginning","journal","archive"] },
        minutes:1,
        url:"posts/2026-01-30.html",
        body:{
          zh:["今天我正式开始用 songyangao.com 记录生活。","希望十年后回头看，我不会后悔从这里开始。"],
          en:["Today I officially started using songyangao.com to record life.","I hope that ten years later, looking back, I will not regret starting here."]
        }
      }
    ];

    function renderDiary(){
      const lang = window.ErnestI18n?.lang?.() || localStorage.getItem("ernest_journal_lang") || "zh";
      const list = document.getElementById("diaryList");
      list.innerHTML = diaryEntries.map((entry, index) => `
        <article class="diary-card fade-in ${index === 0 ? "is-open" : ""}">
          <button class="diary-toggle" type="button" aria-expanded="${index === 0}">
            <div class="diary-head">
              <div>
                <h2 class="diary-title">${entry.date} - ${entry.title[lang]}</h2>
                <div class="diary-meta">
                  <span>${entry.location[lang]}</span>
                  <span>${entry.minutes} ${window.ErnestI18n?.t?.("diary.minutes") || (lang === "zh" ? "分钟阅读" : "min read")}</span>
                  <span class="mood">${entry.mood[lang]}</span>
                  ${entry.tags[lang].map(tag => `<span class="tag">#${tag}</span>`).join("")}
                </div>
              </div>
              <span class="chev"></span>
            </div>
          </button>
          <div class="diary-body">
            <div class="diary-body-inner">
              <div class="entry-text">
                ${entry.body[lang].map(paragraph => `<p>${paragraph}</p>`).join("")}
              </div>
              <div class="entry-actions">
                <a href="${entry.url}" data-i18n="diary.read">${lang === "zh" ? "阅读全文 ->" : "Read full entry ->"}</a>
                <span>
                  ${index < diaryEntries.length - 1 ? `<a href="#entry-${index + 1}" data-open="${index + 1}" data-i18n="diary.previous">${lang === "zh" ? "上一篇" : "Previous"}</a>` : ""}
                  ${index > 0 ? `<a href="#entry-${index - 1}" data-open="${index - 1}" data-i18n="diary.next">${lang === "zh" ? "下一篇" : "Next"}</a>` : ""}
                </span>
              </div>
            </div>
          </div>
        </article>
      `).join("");

      [...list.children].forEach((card, index) => {
        card.id = `entry-${index}`;
        const toggle = card.querySelector(".diary-toggle");
        toggle.addEventListener("click", () => {
          const open = card.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", String(open));
        });
      });

      list.querySelectorAll("[data-open]").forEach(link => {
        link.addEventListener("click", () => {
          const card = list.children[Number(link.dataset.open)];
          card.classList.add("is-open");
          card.querySelector(".diary-toggle").setAttribute("aria-expanded", "true");
        });
      });
    }

    renderDiary();
    window.addEventListener("ernest:languagechange", renderDiary);
  </script>
  <script src="assets/js/site.js"></script>
</body>
</html>
