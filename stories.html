<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ernest's Journal 的小说与长文：旅行片段、虚构故事、日记式短篇和公路小说草稿。">
  <meta property="og:title" content="小说 | Ernest's Journal">
  <meta property="og:description" content="一个安静的文学角落，保存长文、路上的笔记和反思。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://songyangao.com/stories.html">
  <title>小说 | Ernest's Journal</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    :root{
      --bg:#fbf7f0;
      --card:#ffffff;
      --text:#1f1f1f;
      --muted:#6b5f54;
      --border:#eadfce;
      --accent:#7a4e2d;
      --selected:#f2e7d6;
      --shadow:0 10px 25px rgba(0,0,0,.055);
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.85;
    }

    .container{
      max-width:920px;
      margin:0 auto;
      padding:54px 20px 96px;
    }

    header{
      text-align:center;
      margin-bottom:38px;
    }

    h1{
      margin:0 0 10px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:46px;
      font-weight:500;
      letter-spacing:.2px;
    }

    .subtitle{
      max-width:560px;
      margin:0 auto;
      color:var(--muted);
      font-size:15px;
    }

    .nav{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px;
      margin:26px 0 0;
    }

    .nav a{
      text-decoration:none;
      color:var(--muted);
      padding:6px 10px;
      border-radius:12px;
    }

    .nav a:hover,
    .nav a.active{
      background:var(--selected);
      color:var(--accent);
    }

    .story-list{
      display:grid;
      gap:22px;
    }

    .story-card{
      display:grid;
      grid-template-columns:1fr auto;
      gap:28px;
      align-items:start;
      padding:28px;
      border:1px solid var(--border);
      border-radius:18px;
      background:rgba(255,255,255,.78);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:var(--text);
    }

    .story-card:hover{
      border-color:#d9c7ad;
      transform:translateY(-1px);
      transition:transform .18s ease,border-color .18s ease;
    }

    .story-kicker{
      color:var(--accent);
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .story-card h2{
      margin:8px 0 10px;
      font-family:Georgia,"Times New Roman",serif;
      font-weight:500;
      font-size:30px;
      line-height:1.22;
    }

    .excerpt{
      margin:0;
      color:#3a342f;
      max-width:620px;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:16px;
      color:var(--muted);
      font-size:13px;
    }

    .tag{
      border:1px solid var(--border);
      background:#fffaf3;
      color:var(--accent);
      border-radius:999px;
      padding:2px 8px;
    }

    .story-date{
      color:var(--muted);
      font-family:Georgia,"Times New Roman",serif;
      font-size:15px;
      white-space:nowrap;
      padding-top:8px;
    }

    .note{
      margin-top:34px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media (max-width:700px){
      .container{ padding:38px 16px 82px; }
      h1{ font-size:38px; }
      .story-card{
        grid-template-columns:1fr;
        gap:8px;
        padding:22px;
      }
      .story-card h2{ font-size:27px; }
      .story-date{ padding-top:0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="fade-in">
      <h1 data-i18n="stories.title">小说</h1>
      <p class="subtitle" data-i18n="stories.subtitle">
        更长一点的文字：旅行片段、想象中的路、像日记一样的短篇，以及对人声的保存。
      </p>

      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">日记</a>
        <a href="stories.html" class="active">小说</a>
        <a href="field-notes.html">札记</a>

        <a href="timeline.html">时间线</a>
        <a href="travel.html">旅行</a>
        <a href="travel-map.html">地图</a>
        <a href="library.html">书影音</a>
        <a href="photos.html">照片</a>
        <a href="life.html">生活</a>
        <a href="plans.html">计划</a>
        <a href="about.html">关于</a>
      </nav>
    </header>

    <main class="story-list">
      <a class="story-card fade-in" href="stories/road-to-petra.html">
        <div>
          <div class="story-kicker" data-i18n="stories.kicker.petra">公路小说</div>
          <h2 data-i18n="stories.title.petra">去佩特拉之前的路</h2>
          <p class="excerpt" data-i18n="stories.excerpt.petra">一条沙漠公路、一辆租来的车，以及抵达某个早已住进想象里的地方之前，那种奇异的安静。</p>
          <div class="meta">
            <span class="tag" data-i18n="stories.tag.travel">旅行</span>
            <span class="tag" data-i18n="stories.tag.road">公路小说</span>
            <span data-i18n="stories.readtime.petra">6 分钟阅读</span>
          </div>
        </div>
        <div class="story-date">2026</div>
      </a>

      <a class="story-card fade-in" href="stories/rain-at-tanjong-pagar.html">
        <div>
          <div class="story-kicker" data-i18n="stories.kicker.rain">日记小说</div>
          <h2 data-i18n="stories.title.rain">丹戎巴葛的雨</h2>
          <p class="excerpt" data-i18n="stories.excerpt.rain">下班后的一个小时，城市变得会反光：玻璃楼、湿路面，还有一个跟着人回家的小念头。</p>
          <div class="meta">
            <span class="tag" data-i18n="stories.tag.fiction">虚构</span>
            <span class="tag" data-i18n="stories.tag.diary">日记</span>
            <span data-i18n="stories.readtime.rain">4 分钟阅读</span>
          </div>
        </div>
        <div class="story-date">2026</div>
      </a>
    </main>

    <p class="note" data-i18n="stories.note">未来的故事可以继续作为文章页加入，也可以从 markdown 风格的内容生成。</p>
  </div>

  <script src="assets/js/i18n.js"></script>
