    <p data-i18n="post.building.p1">今天我终于让 Plans 页面像一个真正的数据系统。它不再只是本地笔记，也开始具备让朋友看到计划的可能。</p>
    <p data-i18n="post.building.p2">从 GitHub Pages 到 Cloudflare Worker，再到 KV 存储，这是我第一次完整尝试为这个小网站做前后端分离。</p>
    <p data-i18n="post.building.p3">它仍然很简单，但这种简单现在有了框架。这个网站正在慢慢成为一个可以同时保存旅行念头、日记和未来计划的个人档案。</p>
