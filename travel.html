<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ernest's travel archive with country cards, filters, memories, budgets, and planned journeys.">
<meta property="og:title" content="Travel | Ernest's Journal">
<meta property="og:description" content="A warm visual archive of completed and planned journeys.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://songyangao.com/travel.html">
<title>Travel | Ernest's Journal</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">

<style>
:root{
  --bg:#fbf7f0;
  --card:#ffffff;
  --text:#1f1f1f;
  --muted:#6b5f54;
  --border:#eadfce;
  --accent:#7a4e2d;
  --selected:#f2e7d6;
  --shadow:0 10px 25px rgba(0,0,0,.06);
  --radius:18px;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 18px 90px;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:24px;
}

.nav{
  text-align:center;
  margin-bottom:30px;
}

.nav a{
  margin:0 10px;
  text-decoration:none;
  color:var(--muted);
  padding:6px 10px;
  border-radius:12px;
}

.nav a:hover,
.nav a.active{
  background:var(--selected);
  color:var(--accent);
}

.map-band{
  position:relative;
  background:
    radial-gradient(circle at 18% 35%, rgba(122,78,45,.16), transparent 18%),
    radial-gradient(circle at 62% 28%, rgba(201,139,87,.16), transparent 20%),
    radial-gradient(circle at 78% 62%, rgba(122,78,45,.12), transparent 18%),
    var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.map-band::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px dashed rgba(122,78,45,.18);
  border-radius:999px;
  pointer-events:none;
}

.filters{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.filters label{
  color:var(--muted);
  font-size:13px;
}

select{
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  padding:8px 10px;
  color:var(--text);
}

.travel-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}

.travel-card{
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.04);
  overflow:hidden;
}

.photo-placeholder{
  min-height:118px;
  display:flex;
  align-items:flex-end;
  padding:14px;
  color:#fff;
  background:
    linear-gradient(160deg, rgba(122,78,45,.45), rgba(31,31,31,.08)),
    var(--photo, #cfa67b);
}

.country{
  font-size:24px;
  font-weight:700;
  text-shadow:0 2px 12px rgba(0,0,0,.18);
}

.travel-body{ padding:14px; }

.travel-meta{
  display:grid;
  gap:6px;
  color:var(--muted);
  font-size:13px;
}

.status{
  display:inline-block;
  width:max-content;
  border-radius:999px;
  padding:3px 8px;
  font-size:12px;
  border:1px solid var(--border);
  background:#fffaf3;
}

.status.completed{ color:#2f7a4f; }
.status.planned{ color:#b06a2c; }

.detail-toggle{
  margin-top:12px;
  width:100%;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  padding:7px 10px;
  color:var(--accent);
  cursor:pointer;
}

.travel-detail{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .28s ease, opacity .22s ease;
}

.travel-card.is-open .travel-detail{
  grid-template-rows:1fr;
  opacity:1;
}

.travel-detail-inner{
  overflow:hidden;
}

.memory{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed #efe5d7;
  color:#3a342f;
  font-size:14px;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:var(--muted);
}

@media (max-width:900px){
  .travel-grid{ grid-template-columns:repeat(2, 1fr); }
}

@media (max-width:640px){
  .container{ padding:34px 16px 78px; }
  .nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .nav a{ margin:0; background:rgba(255,255,255,.45); }
  .map-band{ padding:14px; }
  .filters{ display:grid; grid-template-columns:1fr; }
  .filters > div{ display:grid; gap:6px; }
  .travel-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="container">
  <h1>Travel Map</h1>
  <div class="subtitle">Places I have been - places I will go.</div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="diary.html">Diary</a>
    <a href="travel.html" class="active">Travel</a>
    <a href="plans.html">Plans</a>
    <a href="about.html">About</a>
  </div>

  <section class="map-band fade-in">
    <div class="filters">
      <div>
        <label for="continentFilter">Continent</label>
        <select id="continentFilter">
          <option value="all">All continents</option>
        </select>
      </div>
      <div>
        <label for="yearFilter">Year</label>
        <select id="yearFilter">
          <option value="all">All years</option>
        </select>
      </div>
    </div>

    <div class="travel-grid" id="travelGrid"></div>
  </section>

  <div class="footer">Every journey leaves a mark.</div>
</div>

<script>
const trips = [
  {
    country:"Jordan",
    city:"Petra / Wadi Rum",
    year:"2025",
    continent:"Asia",
    transportation:"Self-drive",
    status:"completed",
    memories:"Desert camping, red stone, and the feeling of driving through an ancient silence.",
    budget:"TBD",
    color:"#c98b57"
  },
  {
    country:"Madagascar",
    city:"Antananarivo / Baobab Avenue",
    year:"2026",
    continent:"Africa",
    transportation:"Flight",
    status:"planned",
    memories:"A planned journey for baobabs, island roads, and slow notebooks.",
    budget:"Planning",
    color:"#9f7f52"
  },
  {
    country:"Iceland",
    city:"Ring Road",
    year:"Future",
    continent:"Europe",
    transportation:"Road trip",
    status:"planned",
    memories:"Northern lights, long roads, waterfalls, and a winter sky worth waiting for.",
    budget:"Dream",
    color:"#8aa0a8"
  }
];

const continentFilter = document.getElementById("continentFilter");
const yearFilter = document.getElementById("yearFilter");
const travelGrid = document.getElementById("travelGrid");

function fillFilters(){
  [...new Set(trips.map(trip => trip.continent))].sort().forEach(continent => {
    continentFilter.insertAdjacentHTML("beforeend", `<option value="${continent}">${continent}</option>`);
  });
  [...new Set(trips.map(trip => trip.year))].sort().forEach(year => {
    yearFilter.insertAdjacentHTML("beforeend", `<option value="${year}">${year}</option>`);
  });
}

function renderTrips(){
  const continent = continentFilter.value;
  const year = yearFilter.value;
  const filtered = trips.filter(trip =>
    (continent === "all" || trip.continent === continent) &&
    (year === "all" || trip.year === year)
  );

  travelGrid.innerHTML = filtered.map(trip => `
    <article class="travel-card" style="--photo:${trip.color}">
      <div class="photo-placeholder">
        <div class="country">${trip.country}</div>
      </div>
      <div class="travel-body">
        <div class="travel-meta">
          <span>${trip.city}</span>
          <span>${trip.year} - ${trip.transportation}</span>
          <span class="status ${trip.status}">${trip.status}</span>
        </div>
        <button class="detail-toggle" type="button">View details</button>
        <div class="travel-detail">
          <div class="travel-detail-inner">
            <div class="memory">
              <strong>Memory</strong><br>
              ${trip.memories}
              <br><br>
              <strong>Budget</strong><br>
              ${trip.budget}
            </div>
          </div>
        </div>
      </div>
    </article>
  `).join("");

  travelGrid.querySelectorAll(".detail-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const card = button.closest(".travel-card");
      const open = card.classList.toggle("is-open");
      button.textContent = open ? "Hide details" : "View details";
    });
  });
}

continentFilter.addEventListener("change", renderTrips);
yearFilter.addEventListener("change", renderTrips);
fillFilters();
renderTrips();
</script>
<script src="assets/js/site.js"></script>
</body>
</html>
