<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ernest 的旅行档案：国家卡片、筛选、回忆、预算和未来旅程。">
<meta property="og:title" content="旅行 | Ernest's Journal">
<meta property="og:description" content="一个温暖的视觉旅行档案，保存去过和将去的地方。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://songyangao.com/travel.html">
<title>旅行 | Ernest's Journal</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">

<style>
:root{
  --bg:#fbf7f0;
  --card:#ffffff;
  --text:#1f1f1f;
  --muted:#6b5f54;
  --border:#eadfce;
  --accent:#7a4e2d;
  --selected:#f2e7d6;
  --shadow:0 10px 25px rgba(0,0,0,.06);
  --radius:18px;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 18px 90px;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:24px;
}

.nav{
  text-align:center;
  margin-bottom:30px;
}

.nav a{
  margin:0 10px;
  text-decoration:none;
  color:var(--muted);
  padding:6px 10px;
  border-radius:12px;
}

.nav a:hover,
.nav a.active{
  background:var(--selected);
  color:var(--accent);
}

.map-band{
  position:relative;
  background:
    radial-gradient(circle at 18% 35%, rgba(122,78,45,.16), transparent 18%),
    radial-gradient(circle at 62% 28%, rgba(201,139,87,.16), transparent 20%),
    radial-gradient(circle at 78% 62%, rgba(122,78,45,.12), transparent 18%),
    var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.map-band::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px dashed rgba(122,78,45,.18);
  border-radius:999px;
  pointer-events:none;
}

.filters{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.filters label{
  color:var(--muted);
  font-size:13px;
}

select{
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  padding:8px 10px;
  color:var(--text);
}

.travel-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}

.travel-card{
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.04);
  overflow:hidden;
}

.photo-placeholder{
  min-height:118px;
  display:flex;
  align-items:flex-end;
  padding:14px;
  color:#fff;
  background:
    linear-gradient(160deg, rgba(122,78,45,.45), rgba(31,31,31,.08)),
    var(--photo, #cfa67b);
}

.country{
  font-size:24px;
  font-weight:700;
  text-shadow:0 2px 12px rgba(0,0,0,.18);
}

.travel-body{ padding:14px; }

.travel-meta{
  display:grid;
  gap:6px;
  color:var(--muted);
  font-size:13px;
}

.status{
  display:inline-block;
  width:max-content;
  border-radius:999px;
  padding:3px 8px;
  font-size:12px;
  border:1px solid var(--border);
  background:#fffaf3;
}

.status.completed{ color:#2f7a4f; }
.status.planned{ color:#b06a2c; }

.detail-toggle{
  margin-top:12px;
  width:100%;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  padding:7px 10px;
  color:var(--accent);
  cursor:pointer;
}

.travel-detail{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .28s ease, opacity .22s ease;
}

.travel-card.is-open .travel-detail{
  grid-template-rows:1fr;
  opacity:1;
}

.travel-detail-inner{
  overflow:hidden;
}

.memory{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed #efe5d7;
  color:#3a342f;
  font-size:14px;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:var(--muted);
}

@media (max-width:900px){
  .travel-grid{ grid-template-columns:repeat(2, 1fr); }
}

@media (max-width:640px){
  .container{ padding:34px 16px 78px; }
  .nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .nav a{ margin:0; background:rgba(255,255,255,.45); }
  .map-band{ padding:14px; }
  .filters{ display:grid; grid-template-columns:1fr; }
  .filters > div{ display:grid; gap:6px; }
  .travel-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="container">
  <h1 data-i18n="travel.title">旅行地图</h1>
  <div class="subtitle" data-i18n="travel.subtitle">去过的地方，和将要抵达的地方。</div>

  <div class="nav">
    <a href="index.html">首页</a>
    <a href="diary.html">日记</a>
    <a href="stories.html">小说</a>
    <a href="field-notes.html">札记</a>
    <a href="now.html">近况</a>
    <a href="timeline.html">时间线</a>
    <a href="travel.html" class="active">旅行</a>
    <a href="travel-map.html">地图</a>
    <a href="library.html">书影音</a>
    <a href="photos.html">照片</a>
    <a href="life.html">生活</a>
    <a href="plans.html">计划</a>
    <a href="about.html">关于</a>
  </div>

  <section class="map-band fade-in">
    <div class="filters">
      <div>
        <label for="continentFilter" data-i18n="travel.continent">大洲</label>
        <select id="continentFilter">
          <option value="all" data-i18n="travel.allContinents">所有大洲</option>
        </select>
      </div>
      <div>
        <label for="yearFilter" data-i18n="travel.year">年份</label>
        <select id="yearFilter">
          <option value="all" data-i18n="travel.allYears">所有年份</option>
        </select>
      </div>
    </div>

    <div class="travel-grid" id="travelGrid"></div>
  </section>

  <div class="footer" data-i18n="travel.footer">每一次旅行都会留下痕迹。</div>
</div>

<script>
const trips = [
  {
    country:{ zh:"约旦", en:"Jordan" },
    city:{ zh:"佩特拉 / 瓦迪拉姆", en:"Petra / Wadi Rum" },
    year:"2025",
    continent:"Asia",
    transportation:{ zh:"自驾", en:"Self-drive" },
    status:"completed",
    memories:{ zh:"沙漠露营、红色岩石，以及开车穿过古老寂静时的感觉。", en:"Desert camping, red stone, and the feeling of driving through an ancient silence." },
    budget:{ zh:"待整理", en:"TBD" },
    color:"#c98b57"
  },
  {
    country:{ zh:"马达加斯加", en:"Madagascar" },
    city:{ zh:"塔那那利佛 / 猴面包树大道", en:"Antananarivo / Baobab Avenue" },
    year:"2026",
    continent:"Africa",
    transportation:{ zh:"飞机", en:"Flight" },
    status:"planned",
    memories:{ zh:"一场正在计划中的旅行：猴面包树、岛上的路，以及慢慢写下来的笔记。", en:"A planned journey for baobabs, island roads, and slow notebooks." },
    budget:{ zh:"计划中", en:"Planning" },
    color:"#9f7f52"
  },
  {
    country:{ zh:"冰岛", en:"Iceland" },
    city:{ zh:"环岛公路", en:"Ring Road" },
    year:{ zh:"未来", en:"Future" },
    continent:"Europe",
    transportation:{ zh:"公路旅行", en:"Road trip" },
    status:"planned",
    memories:{ zh:"极光、长路、瀑布，以及值得等待的冬天夜空。", en:"Northern lights, long roads, waterfalls, and a winter sky worth waiting for." },
    budget:{ zh:"梦想清单", en:"Dream" },
    color:"#8aa0a8"
  }
];

const continentFilter = document.getElementById("continentFilter");
const yearFilter = document.getElementById("yearFilter");
const travelGrid = document.getElementById("travelGrid");

function fillFilters(){
  [...new Set(trips.map(trip => trip.continent))].sort().forEach(continent => {
    continentFilter.insertAdjacentHTML("beforeend", `<option value="${continent}">${continent}</option>`);
  });
  [...new Set(trips.map(trip => typeof trip.year === "object" ? trip.year.en : trip.year))].sort().forEach(year => {
    const label = year === "Future" ? "未来" : year;
    yearFilter.insertAdjacentHTML("beforeend", `<option value="${year}">${label}</option>`);
  });
}

function renderTrips(){
  const lang = window.ErnestI18n?.lang?.() || localStorage.getItem("ernest_journal_lang") || "zh";
  const continent = continentFilter.value;
  const year = yearFilter.value;
  const filtered = trips.filter(trip =>
    (continent === "all" || trip.continent === continent) &&
    (year === "all" || (typeof trip.year === "object" ? trip.year.en : trip.year) === year)
  );

  travelGrid.innerHTML = filtered.map(trip => `
    <article class="travel-card" style="--photo:${trip.color}">
      <div class="photo-placeholder">
        <div class="country">${trip.country[lang]}</div>
      </div>
      <div class="travel-body">
        <div class="travel-meta">
          <span>${trip.city[lang]}</span>
          <span>${(typeof trip.year === "object" ? trip.year[lang] : trip.year)} - ${trip.transportation[lang]}</span>
          <span class="status ${trip.status}">${window.ErnestI18n?.t?.(`travel.${trip.status}`) || trip.status}</span>
        </div>
        <button class="detail-toggle" type="button" data-i18n="travel.details">${window.ErnestI18n?.t?.("travel.details") || "查看详情"}</button>
        <div class="travel-detail">
          <div class="travel-detail-inner">
            <div class="memory">
              <strong data-i18n="travel.memory">${window.ErnestI18n?.t?.("travel.memory") || "记忆"}</strong><br>
              ${trip.memories[lang]}
              <br><br>
              <strong data-i18n="travel.budget">${window.ErnestI18n?.t?.("travel.budget") || "预算"}</strong><br>
              ${trip.budget[lang]}
            </div>
          </div>
        </div>
      </div>
    </article>
  `).join("");

  travelGrid.querySelectorAll(".detail-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const card = button.closest(".travel-card");
      const open = card.classList.toggle("is-open");
      const key = open ? "travel.hide" : "travel.details";
      button.dataset.i18n = key;
      button.textContent = window.ErnestI18n ? window.ErnestI18n.t(key) : (open ? "Hide details" : "View details");
    });
  });
  window.ErnestI18n?.apply();
}

function updateTravelFilterLabels(){
  const lang = window.ErnestI18n?.lang?.() || localStorage.getItem("ernest_journal_lang") || "zh";
  [...yearFilter.options].forEach(option => {
    if(option.value === "Future") option.textContent = lang === "zh" ? "未来" : "Future";
  });
}

continentFilter.addEventListener("change", renderTrips);
yearFilter.addEventListener("change", renderTrips);
fillFilters();
renderTrips();
window.addEventListener("ernest:languagechange", () => {
  updateTravelFilterLabels();
  renderTrips();
});
</script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
