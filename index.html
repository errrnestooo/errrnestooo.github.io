<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Ernest's Journal — A Life in Progress</title>
 <style>
  :root{
    --bg: #fbf7f0;        /* 奶油暖白 */
    --card: #ffffffcc;     /* 半透明白卡片 */
    --text: #1f1f1f;       /* 深灰黑 */
    --muted: #6b5f54;      /* 暖灰 */
    --line: #eadfce;       /* 暖色分割线 */
    --link: #7a4e2d;       /* 暖棕 */
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "PingFang SC","Microsoft YaHei", sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 22px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
  }

  h1{
    text-align: center;
    letter-spacing: 0.5px;
    margin: 0 0 18px 0;
    font-size: 42px;
  }

  .nav{
    text-align: center;
    margin-bottom: 34px;
  }

  .nav a{
    margin: 0 12px;
    text-decoration: none;
    color: var(--muted);
    padding: 6px 8px;
    border-radius: 10px;
    transition: background .15s ease, color .15s ease;
  }

  .nav a:hover{
    background: #f2e7d6;
    color: var(--link);
  }

  .post{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px;
    margin: 18px 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.04);
  }

  .post h2{
    margin: 0 0 10px 0;
    font-size: 26px;
  }

  .post p{
    margin: 0;
    color: #3a342f;
  }
</style>
</head>
<body>

<h1>Ernest's Journal — A Life in Progress</h1>

<div class="nav">
  <a href="#">Home</a>
  <a href="#">Diary</a>
  <a href="#">Travel</a>
  <a href="#">Plans</a>
  <a href="#">About</a>
</div>

<div class="post">
  <h2>2026-01-30 · 开始记录</h2>
  <p>
    今天正式开始用 songyangao.com 记录人生。
    希望十年后回看，不会后悔今天的决定。
  </p>
</div>

</body>
</html>
